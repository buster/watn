[package]
name = "watn"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dialoguer = "0.11"
atty = "0.2"

[dev-dependencies]
cucumber = "0.23"
tokio = { version = "1", features = ["full"] }
httpmock = "0.7"

[[test]]
name = "features_runner"
harness = false
