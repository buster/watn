[package]
name = "watn"
version = "0.1.2"
edition = "2021"
description = "Ask in plain language. Get one command."
license = "GPL-3.0-or-later"
repository = "https://github.com/buster/watn"
homepage = "https://github.com/buster/watn"
documentation = "https://github.com/buster/watn"
readme = "README.md"
keywords = ["cli", "shell", "command", "ai", "llm"]
categories = ["command-line-utilities"]
exclude = ["coverage/", "givn/", "docs/", ".agents/", ".claude/", ".opencode/", ".ralph/"]

[features]
default = []
test-support = []

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ctrlc = "3"
ratatui = "0.30"
crossterm = "0.29.0"
clap_complete = "4.6.9"

[dev-dependencies]
cucumber = "0.23"
tokio = { version = "1", features = ["full"] }
httpmock = "0.7"
regex = "1"
tempfile = "3"
nix = { version = "0.29", features = ["signal", "process"] }
futures = "0.3.33"
portable-pty = "0.9"

[[test]]
name = "features_runner"
harness = false
