verify:
  command: "cargo test --test features_runner -- --tags 'not @wip'"
  e2e_command: "cargo test --test features_runner -- --tags '@e2e and not @wip'"

coverage:
  non_e2e_command: "mkdir -p coverage && cargo llvm-cov test --test features_runner --cobertura --output-path coverage/non-e2e-cobertura.xml -- --tags 'not @wip'"
  e2e_command: "mkdir -p coverage && cargo llvm-cov test --test features_runner --cobertura --output-path coverage/e2e-cobertura.xml -- --tags '@e2e and not @wip'"
