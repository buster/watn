verify:
  command: "root=$(mktemp -d /tmp/watn-transport.XXXXXX) && trap 'rm -rf \"$root\"' EXIT && cargo build --locked --bin watn && cp target/debug/watn \"$root/default-debug\" && cargo build --locked --features test-support --bin watn && cp target/debug/watn \"$root/test-support-debug\" && WATN_DEFAULT_DEBUG_BIN=\"$root/default-debug\" WATN_TEST_SUPPORT_DEBUG_BIN=\"$root/test-support-debug\" cargo test --locked --test features_runner --features test-support -- --tags 'not @wip and not @e2e'"
  e2e_command: "root=$(mktemp -d /tmp/watn-transport.XXXXXX) && trap 'rm -rf \"$root\"' EXIT && cargo build --locked --bin watn && cp target/debug/watn \"$root/default-debug\" && cargo build --locked --features test-support --bin watn && cp target/debug/watn \"$root/test-support-debug\" && WATN_DEFAULT_DEBUG_BIN=\"$root/default-debug\" WATN_TEST_SUPPORT_DEBUG_BIN=\"$root/test-support-debug\" cargo test --locked --test features_runner --features test-support -- --tags '@e2e and not @wip'"

coverage:
  measure_command: "./measure-coverage.sh"
  merge_command: "./merge-coverages.sh"
  non_e2e_path: "coverage/non-e2e-cobertura.xml"
  e2e_path: "coverage/e2e-cobertura.xml"
  output_path: "coverage/cobertura-coverage.xml"
