verify:
  command: "root=$(mktemp -d /tmp/watn-transport.XXXXXX) && trap 'rm -rf \"$root\"' EXIT && cargo build --bin watn && cp target/debug/watn \"$root/default-debug\" && cargo build --features test-support --bin watn && cp target/debug/watn \"$root/test-support-debug\" && WATN_DEFAULT_DEBUG_BIN=\"$root/default-debug\" WATN_TEST_SUPPORT_DEBUG_BIN=\"$root/test-support-debug\" cargo test --test features_runner --features test-support -- --tags 'not @wip and not @e2e'"
  e2e_command: "root=$(mktemp -d /tmp/watn-transport.XXXXXX) && trap 'rm -rf \"$root\"' EXIT && cargo build --bin watn && cp target/debug/watn \"$root/default-debug\" && cargo build --features test-support --bin watn && cp target/debug/watn \"$root/test-support-debug\" && WATN_DEFAULT_DEBUG_BIN=\"$root/default-debug\" WATN_TEST_SUPPORT_DEBUG_BIN=\"$root/test-support-debug\" cargo test --test features_runner --features test-support -- --tags '@e2e and not @wip'"

coverage:
  non_e2e_command: "root=$(mktemp -d /tmp/watn-transport-cov.XXXXXX) && trap 'rm -rf \"$root\"' EXIT && mkdir -p coverage/profraw && cargo llvm-cov clean --workspace && LLVM_PROFILE_FILE=coverage/profraw/%p-%m.profraw cargo llvm-cov run --bin watn --no-report -- --version >/dev/null && cp target/llvm-cov-target/debug/watn \"$root/default-debug\" && LLVM_PROFILE_FILE=coverage/profraw/%p-%m.profraw cargo llvm-cov run --features test-support --bin watn --no-report -- --version >/dev/null && cp target/llvm-cov-target/debug/watn \"$root/test-support-debug\" && LLVM_PROFILE_FILE=coverage/profraw/%p-%m.profraw cargo llvm-cov test --no-clean --lib --features test-support -- --test-threads=1 && LLVM_PROFILE_FILE=coverage/profraw/%p-%m.profraw WATN_DEFAULT_DEBUG_BIN=\"$root/default-debug\" WATN_TEST_SUPPORT_DEBUG_BIN=\"$root/test-support-debug\" cargo llvm-cov test --no-clean --test features_runner --features test-support --cobertura --output-path coverage/non-e2e-cobertura.xml -- --tags 'not @wip and not @e2e'"
  e2e_command: "root=$(mktemp -d /tmp/watn-transport-cov.XXXXXX) && trap 'rm -rf \"$root\"' EXIT && mkdir -p coverage/profraw && cargo llvm-cov clean --workspace && LLVM_PROFILE_FILE=coverage/profraw/%p-%m.profraw cargo llvm-cov run --bin watn --no-report -- --version >/dev/null && cp target/llvm-cov-target/debug/watn \"$root/default-debug\" && LLVM_PROFILE_FILE=coverage/profraw/%p-%m.profraw cargo llvm-cov run --features test-support --bin watn --no-report -- --version >/dev/null && cp target/llvm-cov-target/debug/watn \"$root/test-support-debug\" && LLVM_PROFILE_FILE=coverage/profraw/%p-%m.profraw cargo llvm-cov test --no-clean --lib --features test-support -- --test-threads=1 && LLVM_PROFILE_FILE=coverage/profraw/%p-%m.profraw WATN_DEFAULT_DEBUG_BIN=\"$root/default-debug\" WATN_TEST_SUPPORT_DEBUG_BIN=\"$root/test-support-debug\" cargo llvm-cov test --no-clean --test features_runner --features test-support --cobertura --output-path coverage/e2e-cobertura.xml -- --tags '@e2e and not @wip'"
