verify:
  command: "root=$(mktemp -d) && trap 'rm -rf \"$root\"' EXIT && cargo build --bin watn --target-dir \"$root/default-debug\" && cargo build --features test-support --bin watn --target-dir \"$root/test-support-debug\" && cargo build --release --bin watn --target-dir \"$root/default-release\" && cargo build --release --features test-support --bin watn --target-dir \"$root/test-support-release\" && WATN_DEFAULT_DEBUG_BIN=\"$root/default-debug/debug/watn\" WATN_TEST_SUPPORT_DEBUG_BIN=\"$root/test-support-debug/debug/watn\" WATN_DEFAULT_RELEASE_BIN=\"$root/default-release/release/watn\" WATN_TEST_SUPPORT_RELEASE_BIN=\"$root/test-support-release/release/watn\" cargo test --test features_runner --features test-support -- --tags 'not @wip and not @e2e'"
  e2e_command: "root=$(mktemp -d) && trap 'rm -rf \"$root\"' EXIT && cargo build --bin watn --target-dir \"$root/default-debug\" && cargo build --features test-support --bin watn --target-dir \"$root/test-support-debug\" && cargo build --release --bin watn --target-dir \"$root/default-release\" && cargo build --release --features test-support --bin watn --target-dir \"$root/test-support-release\" && WATN_DEFAULT_DEBUG_BIN=\"$root/default-debug/debug/watn\" WATN_TEST_SUPPORT_DEBUG_BIN=\"$root/test-support-debug/debug/watn\" WATN_DEFAULT_RELEASE_BIN=\"$root/default-release/release/watn\" WATN_TEST_SUPPORT_RELEASE_BIN=\"$root/test-support-release/release/watn\" cargo test --test features_runner --features test-support -- --tags '@e2e and not @wip'"

coverage:
  non_e2e_command: "mkdir -p coverage/profraw && cargo llvm-cov clean --workspace && LLVM_PROFILE_FILE=coverage/profraw/%p-%m.profraw cargo llvm-cov run --bin watn --no-report -- --version >/dev/null && LLVM_PROFILE_FILE=coverage/profraw/%p-%m.profraw cargo llvm-cov test --no-clean --test features_runner --features test-support --cobertura --output-path coverage/non-e2e-cobertura.xml -- --tags 'not @wip and not @e2e'"
  e2e_command: "mkdir -p coverage/profraw && cargo llvm-cov clean --workspace && LLVM_PROFILE_FILE=coverage/profraw/%p-%m.profraw cargo llvm-cov run --bin watn --no-report -- --version >/dev/null && LLVM_PROFILE_FILE=coverage/profraw/%p-%m.profraw cargo llvm-cov test --no-clean --test features_runner --features test-support --cobertura --output-path coverage/e2e-cobertura.xml -- --tags '@e2e and not @wip'"
