verify:
  command: "cargo test --test features_runner"
  e2e_command: "cargo test --test features_runner -- --tags '@e2e'"

coverage:
  non_e2e_command: "mkdir -p coverage && cargo llvm-cov test --test features_runner --cobertura --output-path coverage/non-e2e-cobertura.xml"
  e2e_command: "mkdir -p coverage && cargo llvm-cov test --test features_runner --cobertura --output-path coverage/e2e-cobertura.xml -- --tags '@e2e'"
