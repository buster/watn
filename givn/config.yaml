# Managed by givn. Do not delete the next line.
givn_config_version: "0.2.0"

# --- Test runner -------------------------------------------------------------
# The command givn invokes to run your test suite. Configured in
# givn/commands.yaml — NOT in this file. See givn/commands.yaml for the
# verify.command and verify.e2e_command keys.
#
# The shipped default is a sentinel that prints setup guidance and exits
# non-zero — so nothing ever falsely reports GREEN until you configure a
# real runner in givn/commands.yaml.
#

# --- Coverage gate (archive-level, requires addons.coverage: true) ------------
# Commands that run tests with coverage instrumentation. Configured in
# givn/commands.yaml — NOT in this file. See givn/commands.yaml for the
# coverage.measure_command and coverage.merge_command keys.
#

# --- E2E test runner ----------------------------------------------------------
# Configured in givn/commands.yaml — see verify.e2e_command there.
#

# --- Artifact graph overlay --------------------------------------------------
# Patch the embedded default artifact graph without replacing it. Declare only
# the additions, modifications, or removals you want. Everything else keeps its
# default. See arc42 ch.8.2 for examples and full semantics.
#
# Examples:
#
#   # a) Remove the review gate entirely:
#   # artifacts:
#   #   - id: review
#   #     remove: true
#   # apply:
#   #   requires: [tasks]
#
#   # b) Make review optional (skip without blocking):
#   # artifacts:
#   #   - id: review
#   #     optional: true
#   # apply:
#   #   requires: [tasks]
#
#   # NEVER do this to design-review (optional: true or remove: true). It is
#   # a planning-layer gate that catches a flawed plan before tasks and code
#   # are written from it — removing it does not save time, it defers the
#   # same problems to implementation where they cost far more to fix.
#
#   # c) Add a custom refactor step after implementation:
#   # artifacts:
#   #   - id: refactor
#   #     generates: refactor.md
#   #     requires: [tasks]
#   #     template: refactor.md
#   #     instruction: |
#   #       Record refactorings: what was cleaned up, why, and confirmation
#   #       that all scenarios still pass. No behaviour change.
#   # apply:
#   #   requires: [tasks, refactor, review]

# --- Archive gate ------------------------------------------------------------
# Control which artifacts must be complete before `givn archive` succeeds.
# Default: [tasks, review]  — both must be done and their hooks must pass.
#
# apply:
#   requires: [tasks, review]
#   tracks: "tasks.md"         # file whose checkboxes givn tracks

# --- Hooks (post-artifact gate checks) ---------------------------------------
# Each artifact may declare `post:` hooks that run after it is completed.
# `givn check <artifact>` runs them on demand.
# `givn archive` auto-runs the hooks of all apply.requires artifacts as the gate.
#
# Built-in hook names:
#   verify      -> run verify.command (the test runner)
#   verify-e2e  -> run verify.e2e_command (the e2e smoke test runner).
#                  If any in-scope .feature file has an @e2e-tagged scenario,
#                  this hook HARD FAILS when verify.e2e_command is empty —
#                  it only skips silently when there is genuinely no @e2e
#                  scenario in scope. An @e2e scenario with no configured
#                  runner is an unenforced gap, never an acceptable default.
#   lint        -> run `givn lint` (static .feature check)
# Or: any shell command string.
# Object form adds options: { run: verify, allow_failure: false, name: "..." }
#
# Defaults already in the embedded manifest:
#   tasks.post:  [verify]
#   review.post: [verify, verify-e2e]
#
# Override examples:
# artifacts:
#   - id: tasks
#     post: [lint, verify]
#   - id: review
#     post:
#       - { run: verify, name: "full suite green" }
#       - { run: "scripts/coverage.sh", allow_failure: true }

# --- Addons ------------------------------------------------------------------
# Pre-packaged artifact sets. See arc42 ch.8.11.
# `givn init` enables ALL addons by default (opt-out via `givn init --no-addons`).
# This project's actual settings are below, written by `givn init`/`givn addons`:
#
# addons:
#   arc42: true             # set to false to disable the arc42 documentation artifact
#   absolute_mode: true     # set to false to disable the Absolute Mode communication
#                          # policy. Manages a fenced <!-- givn:begin:absolute-mode -->
#                          # block in AGENTS.md; the rest of AGENTS.md is untouched.
#   readme: true            # set to false to disable the readme scaffolding addon
#   coverage: true          # set to false to disable the coverage lifecycle artifact
#                          # Toggle with: givn addons enable|disable <name>, or
#                          # `givn addons list` to see all known addons.

# --- arc42 configuration (requires addons.arc42: true) -----------------------
# arc42:
#   output_dir: "docs/arc42"     # where durable arc42 docs live (not per-change)
#   chapters:                    # subset/superset of the 12 standard chapters
#     - introduction-and-goals
#     - architecture-constraints
#     - context-and-scope
#     - solution-strategy
#     - building-block-view
#     - runtime-view
#     - deployment-view
#     - crosscutting-concepts
#     - architecture-decisions
#     - quality-requirements
#     - risks-and-technical-debt
#     - glossary
#
# When addons.arc42 is true, the arc42 document is produced during the
# design phase and checked in design-review: design-review requires
# arc42-docs, and arc42-docs itself gates archive (added to
# apply.requires) -- an enabled-but-unfinished arc42 doc blocks
# `givn archive`, not just the "ready-to-archive" status label.

# --- Addon: domain_modeling ---------------------------------------------------
# Skill — model a change's domain (ubiquitous language, aggregates, invariants)
# before design. Generates the givn-domain-modeling skill file on
# `givn skills sync`. Toggle with: givn addons enable|disable domain_modeling.
#
# domain_modeling: false   # set to true to enable

# --- Addon: dev_principles ----------------------------------------------------
# Skill — apply the team's engineering principles during implementation.
# Generates the givn-dev-principles skill file on `givn skills sync`.
# Toggle with: givn addons enable|disable dev_principles.
#
# dev_principles: false   # set to true to enable

# --- Addon: grill_me ----------------------------------------------------------
# Command — Socratically grill the current plan/design, one question at a time.
# Generates the /grill-me opencode command on `givn skills sync`.
# Toggle with: givn addons enable|disable grill_me.
#
# grill_me: false   # set to true to enable

# --- Addon: grill_with_docs ---------------------------------------------------
# Command — grill the plan/design, citing a source in the project's own docs
# for every challenge. Generates the /grill-with-docs opencode command on
# `givn skills sync`. Toggle with: givn addons enable|disable grill_with_docs.
#
# grill_with_docs: false   # set to true to enable

# --- Skill agent targets ------------------------------------------------------
# Which agent targets receive the generated skills and commands.
# `givn init` asks for this selection (default: opencode only); `givn skills
# sync` installs to exactly the persisted targets. Toggle by editing the
# list below (allowed values: opencode, agents, claude).
#
# skills:
#   targets: [opencode]      # set to e.g. [opencode, agents, claude] for all

# --- User overrides preserved from previous version ---
addons:
  arc42: true
  absolute_mode: true
  readme: true
  coverage: true
  domain_modeling: true
  dev_principles: true
  grill_me: true
  grill_with_docs: true
# ---
