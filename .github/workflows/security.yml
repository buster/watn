name: Security

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned security tools
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.8
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install \
            --disable-pip-version-check zizmor==1.29.0
          printf '%s\n' "$HOME/go/bin" "$RUNNER_TEMP/zizmor/bin" >> "$GITHUB_PATH"

      - name: Audit Rust dependencies
        run: cargo audit

      - name: Check dependency policy
        run: cargo deny --locked check advisories bans licenses sources

      - name: Lint GitHub Actions
        run: actionlint

      - name: Audit GitHub Actions security
        run: zizmor .github/workflows
