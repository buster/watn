name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Cache Cargo dependencies and build artifacts
        if: github.event_name != 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: watn-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            watn-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run library tests
        run: cargo test --locked --lib

      - name: Run acceptance scenarios
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d /tmp/watn-ci-acceptance.XXXXXX)"
          trap 'rm -rf "$root"' EXIT
          cargo build --locked --bin watn
          cp target/debug/watn "$root/default-debug"
          cargo build --locked --features test-support --bin watn
          cp target/debug/watn "$root/test-support-debug"
          WATN_DEFAULT_DEBUG_BIN="$root/default-debug" \
            WATN_TEST_SUPPORT_DEBUG_BIN="$root/test-support-debug" \
            cargo test --locked --test features_runner --features test-support -- \
            --tags 'not @wip and not @e2e'
          WATN_DEFAULT_DEBUG_BIN="$root/default-debug" \
            WATN_TEST_SUPPORT_DEBUG_BIN="$root/test-support-debug" \
            cargo test --locked --test features_runner --features test-support -- \
            --tags '@e2e and not @wip'
