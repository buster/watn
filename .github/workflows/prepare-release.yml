name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix, for example 0.1.3"
        required: true
        type: string

concurrency:
  group: crates-io-watn-release-preparation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    env:
      CRATE_NAME: watn
      PRIMARY_BRANCH: main
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ github.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Fish and Zsh for shell syntax checks
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes fish zsh

      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: watn-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            watn-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Cache pinned release tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/
          key: watn-release-tools-${{ runner.os }}-${{ runner.arch }}-cargo-release-1.1.4-git-cliff-2.13.1-cargo-audit-0.22.2-cargo-deny-0.20.2

      - name: Verify branch and clean source
        shell: bash
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          if [[ "$DISPATCH_REF" != "refs/heads/$PRIMARY_BRANCH" ]]; then
            printf 'release preparation must be dispatched from %s, got %s\n' \
              "$PRIMARY_BRANCH" "$DISPATCH_REF" >&2
            exit 1
          fi

          git fetch --no-tags origin \
            "$PRIMARY_BRANCH:refs/remotes/origin/$PRIMARY_BRANCH"
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "refs/remotes/origin/$PRIMARY_BRANCH")" ]]; then
            printf '%s changed while this workflow was starting; retry from a current checkout\n' \
              "$PRIMARY_BRANCH" >&2
            exit 1
          fi

          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            printf 'the release source checkout is not clean\n' >&2
            exit 1
          fi

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'version must be a plain semantic version such as 0.1.3: %s\n' \
              "$RELEASE_VERSION" >&2
            exit 1
          fi

          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          current_version="$(jq -er --arg crate "$CRATE_NAME" \
            '.packages[] | select(.name == $crate) | .version' <<<"$metadata")"

          IFS=. read -r current_major current_minor current_patch <<<"$current_version"
          IFS=. read -r release_major release_minor release_patch <<<"$RELEASE_VERSION"
          if ((
            release_major < current_major ||
            (release_major == current_major && release_minor < current_minor) ||
            (release_major == current_major && release_minor == current_minor && release_patch <= current_patch)
          )); then
            printf 'release version %s must be newer than Cargo.toml version %s\n' \
              "$RELEASE_VERSION" "$current_version" >&2
            exit 1
          fi

          release_tag="v$RELEASE_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$release_tag" >/dev/null 2>&1; then
            printf 'release tag already exists: %s\n' "$release_tag" >&2
            exit 1
          fi

          registry_status="$(curl --silent --show-error --location \
            --user-agent 'watn-release-preparation/0.1 (+https://github.com/buster/watn)' \
            --output /dev/null --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/$CRATE_NAME/$RELEASE_VERSION")"
          if [[ "$registry_status" != 404 ]]; then
            printf 'crate %s %s is already published or crates.io returned HTTP %s\n' \
              "$CRATE_NAME" "$RELEASE_VERSION" "$registry_status" >&2
            exit 1
          fi

          printf 'RELEASE_TAG=%s\nCURRENT_VERSION=%s\n' \
            "$release_tag" "$current_version" >> "$GITHUB_ENV"

      - name: Install pinned release tools
        shell: bash
        run: |
          set -euo pipefail
          if ! cargo release --version 2>/dev/null | grep -Fq 'cargo-release 1.1.4'; then
            cargo install cargo-release --version 1.1.4 --locked
          fi
          if ! git-cliff --version 2>/dev/null | grep -Fq 'git-cliff 2.13.1'; then
            cargo install git-cliff --version 2.13.1 --locked
          fi
          if ! cargo audit --version 2>/dev/null | grep -Fq 'cargo-audit-audit 0.22.2'; then
            cargo install cargo-audit --version 0.22.2 --locked
          fi
          if ! cargo deny --version 2>/dev/null | grep -Fq 'cargo-deny 0.20.2'; then
            cargo install cargo-deny --version 0.20.2 --locked
          fi
      - name: Update Cargo manifest and lockfile
        run: cargo release version --execute --no-confirm --isolated --allow-branch "$PRIMARY_BRANCH" "$RELEASE_VERSION"

      - name: Verify Cargo versions
        shell: bash
        run: |
          set -euo pipefail

          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          manifest_version="$(jq -er --arg crate "$CRATE_NAME" \
            '.packages[] | select(.name == $crate) | .version' <<<"$metadata")"
          if [[ "$manifest_version" != "$RELEASE_VERSION" ]]; then
            printf 'Cargo.toml version is %s, expected %s\n' \
              "$manifest_version" "$RELEASE_VERSION" >&2
            exit 1
          fi

          lock_version="$(awk '
            /^\[\[package\]\]$/ { in_watn = 0 }
            /^name = "watn"$/ { in_watn = 1; next }
            in_watn && /^version = / {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.lock)"
          if [[ "$lock_version" != "$RELEASE_VERSION" ]]; then
            printf 'Cargo.lock version is %s, expected %s\n' \
              "$lock_version" "$RELEASE_VERSION" >&2
            exit 1
          fi

      - name: Generate reviewed changelog
        shell: bash
        run: |
          set -euo pipefail

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
            --sort=-version:refname | awk 'NR == 1 { print; exit }')"
          if [[ -n "$latest_tag" ]]; then
            changelog_range="$latest_tag..HEAD"
          else
            baseline_commit=d5ddb36
            git cat-file -e "$baseline_commit^{commit}"
            changelog_range="$baseline_commit..HEAD"
          fi

          generated_changelog="$RUNNER_TEMP/generated-changelog.md"
          git-cliff "$changelog_range" --tag "$RELEASE_TAG" \
            --output "$generated_changelog"

          python3 - "$generated_changelog" <<'PY'
          from pathlib import Path
          import re
          import sys

          changelog_path = Path("CHANGELOG.md")
          source = changelog_path.read_text()
          generated = Path(sys.argv[1]).read_text()
          unreleased = re.search(r"(?m)^## \[Unreleased\]\s*$", source)
          if unreleased:
              historical = re.search(
                  r"(?m)^## \[(?!Unreleased\])[^\]]+\].*$",
                  source[unreleased.end():],
              )
              if historical is None:
                  raise SystemExit("CHANGELOG.md has no historical release baseline")
              historical_start = unreleased.end() + historical.start()
              historical_text = source[historical_start:]
          else:
              historical = re.search(
                  r"(?m)^## \[(?!Unreleased\])[^\]]+\].*$", source
              )
              if historical is None:
                  raise SystemExit("CHANGELOG.md has no historical release baseline")
              historical_text = source[historical.start():]

          first_generated = re.search(
              r"(?m)^## \[(?!Unreleased\])[^\]]+\].*$", generated
          )
          if first_generated is None:
              raise SystemExit("generated changelog has no release section")

          footer = re.search(
              r"(?m)^\[[^\]]+\]: https?://[^\n]+(?:\n|$)",
              generated[first_generated.start():],
          )
          if footer is None:
              release_text = generated[first_generated.start():].strip()
              footer_text = ""
          else:
              footer_start = first_generated.start() + footer.start()
              release_text = generated[first_generated.start():footer_start].strip()
              footer_text = generated[footer_start:].strip()

          output = (
              generated[:first_generated.start()].rstrip()
              + "\n## [Unreleased]\n\n"
              + release_text
              + "\n\n"
              + historical_text.strip()
          )
          if footer_text:
              output += "\n\n" + footer_text
          changelog_path.write_text(output + "\n")
          PY

          if ! grep -Eq "^## \[$RELEASE_VERSION\]($| - )" CHANGELOG.md; then
            printf 'generated changelog has no release heading for %s\n' \
              "$RELEASE_VERSION" >&2
            exit 1
          fi

      - name: Run formatting and validation checks
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --lib

      - name: Run acceptance scenarios
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d /tmp/watn-release-prep-acceptance.XXXXXX)"
          trap 'rm -rf "$root"' EXIT
          cargo build --locked --bin watn
          cp target/debug/watn "$root/default-debug"
          cargo build --locked --features test-support --bin watn
          cp target/debug/watn "$root/test-support-debug"
          WATN_DEFAULT_DEBUG_BIN="$root/default-debug" \
            WATN_TEST_SUPPORT_DEBUG_BIN="$root/test-support-debug" \
            cargo test --locked --test features_runner --features test-support -- \
            --tags 'not @wip and not @e2e'
          WATN_DEFAULT_DEBUG_BIN="$root/default-debug" \
            WATN_TEST_SUPPORT_DEBUG_BIN="$root/test-support-debug" \
            cargo test --locked --test features_runner --features test-support -- \
            --tags '@e2e and not @wip'

      - name: Run security checks
        run: |
          cargo audit
          cargo deny --locked check advisories bans licenses sources

      - name: Review package contents before commit
        shell: bash
        run: |
          set -euo pipefail
          package_list="$(cargo package --locked --allow-dirty --list)"
          printf '%s\n' "$package_list"
          while IFS= read -r path; do
            case "$path" in
              .cargo_vcs_info.json|.gitignore|CHANGELOG.md|Cargo.lock|Cargo.toml|Cargo.toml.orig|LICENSE|README.md|watn-logo-ascii.txt|src/*|tests/*)
                ;;
              *)
                printf 'unexpected package path: %s\n' "$path" >&2
                exit 1
                ;;
            esac
          done <<<"$package_list"

      - name: Commit release preparation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          while IFS= read -r path; do
            case "$path" in
              Cargo.toml|Cargo.lock|CHANGELOG.md)
                ;;
              "")
                ;;
              *)
                printf 'unexpected release-preparation change: %s\n' "$path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): prepare $RELEASE_TAG"

      - name: Review package and publish dry run
        shell: bash
        run: |
          set -euo pipefail
          package_list="$(cargo package --locked --list)"
          printf '%s\n' "$package_list"
          while IFS= read -r path; do
            case "$path" in
              .cargo_vcs_info.json|.gitignore|CHANGELOG.md|Cargo.lock|Cargo.toml|Cargo.toml.orig|LICENSE|README.md|watn-logo-ascii.txt|src/*|tests/*)
                ;;
              *)
                printf 'unexpected package path: %s\n' "$path" >&2
                exit 1
                ;;
            esac
          done <<<"$package_list"
          cargo publish --locked --dry-run

      - name: Create and verify annotated release tag
        shell: bash
        run: |
          set -euo pipefail
          git tag --annotate "$RELEASE_TAG" --message "Release $RELEASE_TAG"
          if [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != tag ]]; then
            printf 'release tag is not annotated: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG^{commit}")" != "$(git rev-parse HEAD)" ]]; then
            printf 'release tag does not point to the release commit: %s\n' \
              "$RELEASE_TAG" >&2
            exit 1
          fi

      - name: Push release commit and tag
        shell: bash
        env:
          RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_PUSH_TOKEN" ]]; then
            printf 'RELEASE_PUSH_TOKEN must be configured for tag pushes that trigger release workflows\n' >&2
            exit 1
          fi
          auth_header="$(printf 'x-access-token:%s' "$RELEASE_PUSH_TOKEN" | base64 --wrap=0)"
          git -c "http.extraheader=AUTHORIZATION: basic $auth_header" \
            push --atomic origin "$PRIMARY_BRANCH" "$RELEASE_TAG"
